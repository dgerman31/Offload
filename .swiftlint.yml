# Low-noise, bug-catching ruleset — not style bikeshedding. This runs as a non-blocking CI job
# (see .github/workflows/ios.yml's `swiftlint` job); the point is to surface real risk (force
# unwraps, force try, silent optional-boolean footguns) without nagging about things like line
# length or trailing whitespace that don't affect correctness.
opt_in_rules:
  - force_unwrapping
  - force_try
  - fatal_error_message
  - empty_count
  - redundant_nil_coalescing
  - unused_import
  - discouraged_optional_boolean

disabled_rules:
  - line_length
  - trailing_whitespace
  - todo
  # On by default, and squarely the "style bikeshedding" this ruleset says it isn't doing: it
  # was the only thing failing the lint job, across eight files, every one of them a SwiftUI
  # view whose `body` is long because a screen has a lot of screen in it. Splitting a view to
  # satisfy a line count invents indirection that helps no reader. Nothing it flagged was a
  # bug, and a permanently red job teaches you to stop reading the job — which costs more than
  # the rule ever paid for.
  - type_body_length
  # Single-letter locals (`c` for a calendar, `t` for a task under construction) are the house
  # style in test fixtures and short helpers, and renaming them buys nothing.
  - identifier_name
  # Same argument as `type_body_length`, and it started failing the job outright (this one is an
  # *error* past 100 lines, not a warning). The function it flags is `GeminiExtractionService.
  # systemPrompt` — a single multi-line string literal, i.e. one document. Chopping a prompt into
  # five String constants to satisfy a line counter makes it harder to read as the thing it is,
  # and the ordering of its sections is load-bearing. Nothing it flagged was a bug.
  - function_body_length

excluded:
  - .build
  # Test code force-unwraps `DateComponents` fixtures on purpose: a nil there means the fixture
  # itself is wrong, and crashing the test is the correct outcome. Linting for it here would bury
  # the app-code findings this job exists to surface.
  - OffloadTests
