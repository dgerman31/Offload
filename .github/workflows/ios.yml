name: iOS Build

# Compiles Offload on a real Apple Silicon Mac (Xcode 26) every push / PR.
# This is our feedback loop: since the app can't be built on the author's machine,
# CI is the source of truth for "does it compile + do the tests pass".
#
# Speed notes: a normal push only runs the test pass. The unsigned .ipa is a SECOND full
# Release compile, so it's opt-in — add "[ipa]" to the commit message, or run this workflow
# manually from the Actions tab, when you actually want to sideload.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      build_ipa:
        description: "Also build a sideloadable .ipa"
        type: boolean
        default: true

concurrency:
  # Keyed by commit, not by branch. Grouping by `github.ref` with `cancel-in-progress` meant a
  # follow-up push killed the still-running verification of the commit before it — which sounds
  # like a saving right up until you notice that the earlier commit is a *different* fix whose
  # test result you still needed. It bit three times in one session: `ipa` (the shorter job)
  # finished and `test` was cancelled minutes from the end, leaving the branch with a green
  # build and no idea whether the suite passed.
  #
  # Per-commit groups let each push verify itself to completion and never cancel a sibling. The
  # cost is more concurrent runners; macOS minutes are free on a public repo, so that's not a
  # real cost here. Re-pushing the *same* SHA still collapses onto one run, which is the only
  # case where cancelling was ever the right call.
  group: ios-${{ github.sha }}
  cancel-in-progress: true

env:
  # `brew update` alone can cost more than the install itself.
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ANALYTICS: 1

jobs:
  # Test and .ipa are SEPARATE, parallel jobs. They used to be one job doing two full compiles
  # back to back (Debug for the tests, then Release for the .ipa), which landed right on the
  # 12-minute timeout and got the .ipa guillotined mid-build. Splitting them gives each its own
  # clock and its own runner, so a legit build finishes and neither starves the other.
  test:
    # Pinned to a specific image, never `macos-latest`: that label rolls its default Xcode without
    # notice, and with no local Xcode as a fallback this developer can't afford a moving
    # foundation. Kept at `macos-15` rather than bumped — `setup-xcode` below pins Xcode 26.0
    # explicitly, so the image version buys nothing here, and this is the only path to a working
    # build. Not the place to spend a label that hasn't been proven on this repo.
    runs-on: macos-15
    # Raised from 16 after a run took 16m34s and was killed mid-suite. A timed-out job reports as
    # `cancelled`, which reads exactly like the concurrency-cancellation bug this workflow already
    # fixed once — so the number mattering here is worth stating: 16 left only ~5 min of headroom
    # over a run that was already ~8–11 min, and the suite has kept growing (it gained ~50 cases
    # in one batch). Note the cost is *not* the second target: the `ipa` job does a full Release
    # compile of both app and widget extension in under three minutes. It's the Debug compile plus
    # the suite itself.
    #
    # 30 is deliberately generous rather than incremental — being killed at the finish line costs
    # a full re-run and, worse, produces a green `ipa` beside a "cancelled" test job, which is the
    # one outcome that looks like verification without being it. macOS minutes are free on a
    # public repo, so the only thing a tighter bound buys is catching a hang sooner.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"   # Foundation Models needs the iOS 26 SDK.

      # So a broken build's log says which toolchain ran, without having to guess from the
      # runner image version alone.
      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      # Fetching + resolving GRDB every run is pure waste; the checkout is deterministic.
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .spm-cache
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Runner images rotate their simulator sets, so a hardcoded device name eventually
      # vanishes. Pick a real one — but only from an iOS 26 runtime, since anything older
      # can't satisfy the deployment target and xcodebuild will reject it as a destination.
      # (simctl groups devices under `-- iOS 26.2 --` headers, hence the awk state machine.
      # `-showdestinations` isn't reliable here: it returns only placeholders when
      # CoreSimulator hasn't enumerated yet.)
      - name: Pick a simulator
        id: sim
        run: |
          LIST=$(xcrun simctl list devices available)
          echo "$LIST"
          # Prefer a mainstream Pro handset — the exotic ones (Air, SE, "e" variants) are the
          # ones that tend to hang on first boot. Fall back to any iOS 26 iPhone.
          pick() {
            echo "$LIST" | awk -v want="$1" '
              /^-- iOS 26/ { ok = 1; next }
              /^-- /       { ok = 0; next }
              ok && index($0, want) {
                if (match($0, /[0-9A-Fa-f-]{36}/)) { print substr($0, RSTART, RLENGTH); exit }
              }'
          }
          UDID=$(pick "iPhone 17 Pro")
          [ -z "$UDID" ] && UDID=$(pick "iPhone 16 Pro")
          [ -z "$UDID" ] && UDID=$(pick "iPhone")
          if [ -z "$UDID" ]; then echo "::error::No iOS 26 iPhone simulator on this runner"; exit 1; fi

          # Best-effort head start on booting — but don't wait on `bootstatus -b` here. It
          # turns out to hang outright on this runner (confirmed: the job ran to its full
          # timeout sitting on that exact line, once a since-fixed no-op `timeout` wrapper
          # stopped accidentally masking the hang). `xcodebuild test` boots and waits for the
          # simulator itself as part of running the tests, which is its normal, reliable job —
          # no separate pre-check needed.
          xcrun simctl boot "$UDID" 2>/dev/null || true

          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # Build and run are SEPARATE steps, deliberately.
      #
      # They used to be one `xcodebuild test`, and when it hung there was no way to tell
      # whether the compiler or a test was stuck: the job sat silent until the runner killed
      # it, and a runner kill discards xcbeautify's buffered output, so the evidence died with
      # it. (A 26-minute hang left exactly one clue: the last line it happened to have
      # flushed.) Two steps put a labelled boundary between the two possibilities — whichever
      # one is red tells you where to look — and `tee` keeps the raw log even when xcbeautify's
      # filtered view swallows the interesting part.
      #
      # Both share -derivedDataPath so the run step finds what the build step produced.
      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Offload.xcodeproj \
            -scheme Offload \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -clonedSourcePackagesDirPath .spm-cache \
            -skipPackagePluginValidation \
            -derivedDataPath DerivedData \
            ONLY_ACTIVE_ARCH=YES \
            | tee build-for-testing.log | xcbeautify

      # `-test-timeouts-enabled` is the real cure for a silent hang: without it one stuck test
      # blocks the whole job and reports nothing, so a 30-minute wall-clock kill is all you
      # learn. With it, a test that overruns its allowance is killed and reported *by name*,
      # and the rest of the suite still runs — a hang becomes an ordinary failing test.
      - name: Test (Simulator)
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Offload.xcodeproj \
            -scheme Offload \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            | tee test-run.log | xcbeautify

      # The raw, unfiltered logs — the thing that was missing when this last went wrong.
      - name: Upload xcodebuild logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            build-for-testing.log
            test-run.log
          if-no-files-found: ignore
          retention-days: 7

      # Surfaced as a log signal only — no threshold gate. Absolute coverage gates are easy to
      # game and punish legacy code; this just answers "roughly how much is covered" for a human
      # to read, same spirit as diff-coverage tooling favors in 2026.
      - name: Coverage summary
        if: always()
        run: |
          if [ -d TestResults.xcresult ]; then
            xcrun xccov view --report --json TestResults.xcresult > coverage.json || true
            xcrun xccov view --report TestResults.xcresult || true
          else
            echo "No TestResults.xcresult produced (test run likely failed before completing)."
          fi

  # Opt-in: only when the commit message carries [ipa], or the workflow is run manually. Runs in
  # parallel with `test` (no `needs:`), so the sideloadable build is ready in ~7–8 min on its own
  # clock instead of racing the test compile for the last minute of a shared timeout.
  ipa:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ipa]')
    # Same pin as `test` — see the comment there. The .ipa build is the sideload artifact this
    # developer actually installs, so it can least afford a silently-shifted toolchain.
    runs-on: macos-15
    # The Release compile alone is ~7–8 min; give it real headroom so it's never cut off, while
    # still bounding a genuine hang.
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .spm-cache
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Build an UNSIGNED .ipa for sideloading. Sideloadly/AltStore re-sign it with the
      # user's free Apple ID at install time, so no signing is needed here.
      - name: Build unsigned .ipa
        run: |
          set -o pipefail
          xcodebuild \
            -project Offload.xcodeproj \
            -scheme Offload \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath .spm-cache \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | xcbeautify
          APP="build/Build/Products/Release-iphoneos/Offload.app"
          test -d "$APP" || { echo "App not found at $APP"; exit 1; }
          rm -rf Payload Offload.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Offload.ipa Payload
          ls -lh Offload.ipa

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: Offload-ipa
          path: Offload.ipa
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------------------------
  # Everything below is additive and NON-BLOCKING (continue-on-error: true). `test` and `ipa`
  # above are this developer's only verification path with no local Xcode, so nothing here is
  # allowed to touch their pass/fail. Each is a signal to read in the log, not a gate.
  # ---------------------------------------------------------------------------------------------

  # Ruleset lives in .swiftlint.yml — low-noise, bug-catching rules (force unwraps, force try,
  # etc.), not style bikeshedding. Installed via Homebrew rather than baked into the app build so
  # it can never affect `test`/`ipa`.
  #
  # Two jobs that lived here — `strict-warnings` and `swift-format-lint` — were removed after
  # their first run, because neither could ever report anything useful. `strict-warnings` passed
  # `SWIFT_TREAT_WARNINGS_AS_ERRORS` to the whole build, including GRDB, which SPM already builds
  # with `-suppress-warnings`; the two flags conflict and the compile fails before reaching any
  # app code. `swift format` defaults to 2-space indentation and disagreed with essentially every
  # line in the project, which is a style argument with a tool, not a signal. Either could come
  # back with the right per-target scoping or a `.swift-format` matching the house style; neither
  # earns a slot on every push as-is.
  swiftlint:
    runs-on: macos-15
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint
