name: Offload
options:
  bundleIdPrefix: com.danielgerman
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"

settings:
  base:
    MARKETING_VERSION: "3.1.0"
    CURRENT_PROJECT_VERSION: "59"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""           # left blank; Sideloadly / your free Apple ID signs at install time
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Offload:
    type: application
    platform: iOS
    sources:
      - path: Offload
      # Compiled into the app *and* the widget extension — the Live Activity's state type has to
      # exist identically on both sides of ActivityKit. Sharing the file is how xcodegen expresses
      # that; there is no framework target and no App Group involved (a free Apple ID can't have
      # one, and a Live Activity doesn't need one).
      - path: Shared
    dependencies:
      - package: GRDB
      - target: OffloadWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danielgerman.offload
        INFOPLIST_FILE: Offload/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Offload/Resources/Offload.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"   # iPhone
    # Swift Package dependencies are added in later increments (e.g. GRDB).

  # The Lock Screen / Dynamic Island timer. A widget extension is the only way to render a Live
  # Activity — the app itself can start and update one, but the *views* must live in an extension.
  # Bundle id has to be the app's with a suffix, or the system won't associate the two.
  OffloadWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: OffloadWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danielgerman.offload.widgets
        INFOPLIST_FILE: OffloadWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"

  OffloadTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OffloadTests
    dependencies:
      - target: Offload
      - package: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danielgerman.offload.tests
        GENERATE_INFOPLIST_FILE: YES
